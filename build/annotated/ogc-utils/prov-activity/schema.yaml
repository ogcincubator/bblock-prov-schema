        x-jsonld-id: http://www.w3.org/ns/prov#activity
        x-jsonld-type: '@id'
  Generation:
    $anchor: Generation
    allOf:
    - $ref: '#/$defs/ActivityInfluence'
    - type: object
      properties:
        provType:
          const: Generation
          x-jsonld-id: '@type'
  Invalidation:
